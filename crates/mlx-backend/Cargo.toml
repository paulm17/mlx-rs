[package]
name = "mlx-backend"
version = "0.1.0"
edition = "2021"
description = "Dynamic loader for Apple MLX-C runtime"

[dependencies]
anyhow.workspace = true
backend-trait = { path = "../backend-trait" }
libloading = "0.8"
glob = "0.3"
safetensors = "0.4"
serde.workspace = true
serde_json.workspace = true
tokenizers = { version = "0.21", features = ["onig"] }
minijinja = { version = "2", features = ["builtins"] }
llama-lm = { path = "../llama-lm" }
ctor = "0.2"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
