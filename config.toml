[server]
bind = "127.0.0.1"
port = 8080
# model_path = "/path/to/model.gguf"
# api_key = "secret"
# rate_limit_rpm = 120

# llama.cpp engine options
# n_ctx = 4096            # context window size
# n_batch = 512           # prompt batch size
# n_ubatch = 512          # micro batch size
# n_gpu_layers = 99       # layers offloaded to GPU/Metal
# n_threads = 4           # CPU threads for generation
# n_threads_batch = 4     # CPU threads for batch processing
# embedding = true        # enable embedding endpoint
# pooling = "mean"        # pooling type: mean, cls, last, none
# use_mmap = true         # memory-map model file
# use_mlock = false       # lock model in RAM
# flash_attn = false      # flash attention
