[workspace]
members = [
    "crates/backend-trait",
    "crates/llama-lm",
    "crates/mlx-backend",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hf-hub = "0.4"

[package]
name = "llama-rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[[bin]]
name = "llama-server"
path = "src/bin/llama-server.rs"

[[bin]]
name = "llama-rs-runner"
path = "src/bin/llama-rs-runner.rs"

[dependencies]
llama-lm = { path = "crates/llama-lm" }
backend-trait = { path = "crates/backend-trait" }
mlx-backend = { path = "crates/mlx-backend" }
anyhow.workspace = true
axum = "0.7"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "rt-multi-thread"] }
